<html lang="de-CH">
<head>

  <title>Weihnachtsrätsel</title>
  <style>

    button,input{font:inherit}button{cursor:pointer}.shell{width:min(850px,calc(100% - 32px));margin:auto}.top{padding:24px 0 0;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:750;letter-spacing:.16em;text-transform:uppercase}.brand-emblem{width:36px;height:36px;background:#e5cf96;color:#17372e;display:grid;place-items:center;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);font-size:18px}.tag{border:1px solid var(--border);border-radius:99px;padding:7px 11px;color:var(--muted);font-size:11px;letter-spacing:.07em;text-transform:uppercase}

    /* Kurz eingeblendete Hinweise für die beiden Wortspiele */

    /* Wordle */
    .wordle-layout{display:flex;justify-content:center;width:100%;margin:24px 0}.wordle-layout>div{width:min(100%,480px);min-width:0}.wordle-board{display:grid;grid-template-rows:repeat(6,auto);gap:7px;width:100%;margin:auto}.guess-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;width:100%}.letter{width:100%;min-width:0;aspect-ratio:1;border:1px solid #66847a99;display:grid;place-items:center;border-radius:5px;font-size:clamp(22px,4vw,42px);font-weight:800;line-height:1;color:#fff}.letter.filled{border-color:#a9c9b7}.letter.correct{background:#618a67;border-color:#618a67}.letter.present{background:#b79559;border-color:#b79559}.letter.absent{background:#4b5e59;border-color:#4b5e59}.letter.live{border-color:#d5b578}.keypad{width:min(100%,700px);margin:22px auto 0;display:flex;flex-direction:column;gap:6px}.keys{display:flex;justify-content:center;gap:5px}.key{flex:1;min-width:0;height:clamp(47px,5.9vw,64px);border:0;border-radius:5px;background:#567267;color:#fff;font-weight:800;font-size:clamp(12px,1.8vw,18px);padding:0}.key.wide{flex:1.35}.key.correct{background:#618a67}.key.present{background:#b79559}.key.absent{background:#384e49}.wordle-aside{display:grid;gap:12px}.wordle-aside .tiny-card{background:#ffffff0a;padding:15px;border:1px solid var(--border);border-radius:12px}.tiny-card strong{font-family:Georgia,serif;font-size:23px;font-weight:400}.tiny-card span{font-size:13px;color:var(--muted);line-height:1.6;display:block;margin-top:6px}

    /* Photos */
    .missions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px}.mission{background:#0f3029b8;border:1px solid var(--border);border-radius:14px;padding:20px;min-width:0}.mission .icon{width:49px;height:49px;border:1px solid var(--border);display:grid;place-items:center;border-radius:50%;font-size:25px;margin-bottom:14px;color:var(--gold)}.mission .icon svg{width:27px;height:27px;display:block;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.mission h3{font:400 24px Georgia,serif;margin:0 0 7px}.mission .riddle{min-height:62px;font-style:italic;color:#dce6d2;font-size:15px}.mission .micro{font-size:12px;color:var(--muted);line-height:1.6}.file-input{display:none}.upload{display:inline-block;background:#d6b97b;color:#17352c;font-weight:700;border-radius:8px;padding:11px 12px;cursor:pointer;font-size:13px;line-height:1.2;margin-top:12px}.preview{margin-top:12px;border:1px dashed #9bb7a16b;border-radius:9px;min-height:95px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#9fb5a9;font-size:12px;text-align:center}.preview img{width:100%;max-height:160px;object-fit:cover;display:block}.preview canvas{width:100%;height:auto;display:block}.photo-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.photo-actions .upload{margin:0;display:inline-flex;align-items:center;justify-content:center;flex:1 1 135px;min-height:41px;text-align:center;background:#ffffff0b;color:var(--cream);border:1px solid #78988b;transition:background .15s,border-color .15s}.photo-actions .upload:hover{background:#ffffff17;border-color:#b4c9b5}.photo-actions .btn{flex:1 1 145px;font-size:13px}.photo-ai-state{font-size:12px;line-height:1.55;color:#dfd9b7;margin:10px 0 0}.photo-ai-state.good{color:#bdddab}.photo-ai-state.warn{color:#f1c7a2}.photo-ai-detections{color:#c9d8c9;font-size:11px;line-height:1.5;margin-top:5px}.code-entry{display:flex;gap:8px;margin-top:12px}.code-entry input{width:90px;min-width:0;padding:10px;border-radius:8px;border:1px solid #91ae9f;background:#102c28;color:#fff;text-transform:uppercase;text-align:center;letter-spacing:.2em;font-weight:800}.code-entry button{font-size:12px}.mission.ok{border-color:#9dc69d}.mission .result{min-height:20px;font-size:12px;margin-top:8px;color:#e2bda1}.mission .result.ok{color:#bdddab}
    /* Connections */
    .conn-solved{display:grid;gap:7px;margin:18px 0 10px}.solved-row{border-radius:10px;padding:14px 12px;text-align:center;color:#1e2c25}.solved-row strong{display:block;font-size:16px}.solved-row span{display:block;font-size:12px;margin-top:4px}.conn-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:20px 0 16px}.conn-tile{border-radius:9px;border:1px solid #e5dac1;background:#e3dcca;color:#1d332b;text-align:center;min-height:72px;padding:8px 4px;font-size:clamp(10px,1.5vw,13px);font-weight:800;line-height:1.2;overflow-wrap:anywhere}.conn-tile.selected{background:#658675;color:#fff;border-color:#a6c0a8}.conn-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.dots{display:flex;gap:6px;align-items:center}.dot{width:11px;height:11px;border-radius:50%;background:#e6c991}.dot.lost{background:#3a6255;border:1px solid #719082}.conn-fail{color:#efc49c;font-size:13px}.connect-hint{font-size:13px;color:#eed29a}
    /* Hex */
    .hex-board{width:100%;max-width:690px;display:block;margin:10px auto 0;touch-action:manipulation}.hex-item{cursor:pointer;transition:filter .17s}.hex-item:focus{outline:none}.hex-item.selected{filter:drop-shadow(0 0 8px #edce83)}.hex-item .tile-hit{fill:transparent;pointer-events:all}.hex-item .tile-outline{fill:none;stroke:#b2c6af99;stroke-width:1.4;pointer-events:none}.hex-item.selected .tile-outline,.hex-item:focus-visible .tile-outline{stroke:#f8d88d;stroke-width:3.5}.hex-score{text-align:center;color:#d5d7b3;font-family:Georgia,serif;font-size:21px;margin:8px 0 3px}.hex-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
    /* Finale */
    .finale{text-align:center;padding:25px 0}.finale .large-hex{font-size:64px;display:grid;place-items:center;margin:0 auto 20px;width:115px;height:115px;background:#e7c887;color:#12362b;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}.finale h2{font-size:clamp(37px,7vw,58px);line-height:1.08}.finale .gift-name{color:#eed39b;font-style:italic}.finale p{max-width:525px;margin:15px auto;line-height:1.8}.locked{text-align:center;padding:45px 10px}.locked .lock{font-size:39px}.locked h2{margin-top:12px}.footer{padding:36px 0 25px;display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#8fac9d}.hidden{display:none!important}
    /* Nur die Geschenk-Enthüllung erscheint in Bordeauxrot */
    body.christmas-final{--bg:#32101f;--bg2:#5d2036;--cream:#fff0e9;--muted:#e5c5cb;--border:rgba(245,202,207,.28);--gold:#f0c49c;--dark:#32121e;background:radial-gradient(ellipse at 50% 0%,#6e2a47 0%,#3a1024 52%,#270b18 100%)}
    body.christmas-final:before{background:radial-gradient(ellipse at 80% 10%,#aa57744a 0,transparent 52%),radial-gradient(ellipse at 15% 90%,#9b3a564a 0,transparent 60%)}
    body.christmas-final .panel{background:linear-gradient(145deg,#7a304c,#431529 80%);border-color:#ecb7bb67;box-shadow:0 22px 75px #1906127a}
    body.christmas-final .hero h1 i{color:#f1b8c2}
    body.christmas-final .brand-emblem{background:#efc6b3;color:#5b1c35}
    body.christmas-final .progress .step.current{background:#c7788b30;border-color:#df9bac;color:#fff4ed}
    body.christmas-final .progress .step.done{background:#cb71872b;color:#ffe0dc}
    body.christmas-final .finale .large-hex{background:#edc5b3;color:#752b49;filter:drop-shadow(0 5px 18px #e9aabb32)}
    body.christmas-final .finale h2{font-size:clamp(43px,8vw,72px);color:#fff3ee;text-shadow:0 3px 20px #2b071850}
    body.christmas-final .finale .gift-name{color:#f1cba6}
    body.christmas-final .btn.secondary{border-color:#e7abba;color:#fff1ea}
    body.christmas-final .footer{color:#dcb2bd}
    @media(max-width:800px) and (min-width:651px){.missions{grid-template-columns:repeat(2,minmax(0,1fr))}.mission:last-child:nth-child(odd){grid-column:1/-1}}
    @media(max-width:650px){.top{padding-top:15px}.hero{padding:18px 0 5px}.progress .step{padding:9px 8px}.progress .txt{font-size:10px}.wordle-layout{margin:18px 0}.wordle-board{gap:5px}.guess-row{gap:5px}.keypad{gap:5px;width:calc(100% + 10px);max-width:none;margin-left:-5px;margin-right:-5px}.keys{gap:3px}.key{height:clamp(46px,11vw,54px);font-size:clamp(11px,3vw,15px)}.wordle-aside{grid-template-columns:1fr 1fr}.wordle-aside .tiny-card{padding:12px}.wordle-aside .tiny-card strong{font-size:19px}.missions{grid-template-columns:1fr}.mission .riddle{min-height:0}.mission{padding:17px}.conn-tile{min-height:64px;font-size:10px}.panel{padding:19px}.footer{flex-direction:column}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
  </style>

<body>
<div class="shell">
  <header class="top"><div class="brand"><div class="brand-emblem">✦</div><span>Geheime Mission</span></div><div class="tag">24. Dezember · Edition 01</div></header>
  <section class="hero"><div class="eyebrow">Ein Rätsel in vier Kapiteln</div><h1>Operation <i>Weihnachten</i></h1></section>
  <nav class="progress" id="progress" aria-label="Spielfortschritt"></nav>
  <main id="main" aria-live="polite"></main>
  <footer class="footer"><span>Ein kleines Abenteuer für Heiligabend ✦<br>Frohe Weihnachten · Merry Christmas</span><span>Dein Fortschritt wird nur auf diesem Gerät gespeichert.<br><a href="./LICENSES.md" style="color:inherit">Quellen und Lizenzen</a> · Wortliste · Bilderkennung · Icons</span></footer>
</div>
<div id="toast-host" class="toast-host" role="status" aria-live="polite" aria-atomic="true"></div>
<script>
'use strict';
/* ============================ ANPASSUNGEN ============================
   Hier kannst du die Rätseltexte später unkompliziert ändern.
   Stuhl und Weinglas werden lokal im Browser per Bilderkennung geprüft.
   Nach zwei Fehlversuchen oder technischen Problemen kann man
   ohne Bilderkennung fortfahren. Fotos werden nicht an Server übertragen.
   Achtung: Dies ist ein privates Rätsel, keine sichere Zugangskontrolle:
   Lösungen sind im öffentlich einsehbaren HTML-Code enthalten.
===================================================================== */
const CONFIG={
 word:'NATUR',
 photoTasks:[
  {title:'Ein Platz zum Verweilen',clue:'Was braucht es für einen gemütlichen Abend in guter Gesellschaft?',instruction:'Fotografiere einen Stuhl – ein Tisch darf mit aufs Bild.',icon:'armchair',target:'chair',targetLabel:'Stuhl'},
  {title:'Ein kleiner Genuss',clue:'Ein gemütlicher Abend verdient manchmal ein besonderes Glas.',instruction:'Fotografiere ein Weinglas – es darf auch leer sein.',icon:'wine',target:'wine glass',targetLabel:'Weinglas'},
  {title:'Die letzte Zutat',clue:'Was macht einen gemütlichen Abend erst richtig schön? Gute Gesellschaft!',instruction:'Fotografiere deine Spielpartnerin oder deinen Spielpartner. Mindestens eine Person soll zu sehen sein – natürlich mit Einverständnis.',icon:'user-round',target:'person',targetLabel:'Person'}
 ],
 // Diese beiden Werte lassen sich direkt ändern.
 photoRecognition:{minConfidence:0.30,manualAfterFailures:2},
 finalTitle:'Frohe Weihnachten!'
};
// Die Wortliste wird als eigenständige JSON-Datei neben index.html verwaltet.
let validWords=null,wordListError=false;
async function loadWordList(){
 try{
  const response=await fetch('./target-words.json',{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const source=await response.json();
  if(!Array.isArray(source.data))throw new Error('Unerwartetes Format');
  validWords=new Set(source.data.map(w=>String(w).normalize('NFC').toUpperCase()).filter(w=>[...w].length===5));
  validWords.add(CONFIG.word);
  wordListError=false;
 }catch(err){
  wordListError=true;
  console.error('Wortliste nicht verfügbar:',err);
 }
 if(currentRoute==='start'&&!state.wordWon&&wordListError)showToast('Wortliste nicht verfügbar – bitte neu laden');
}
const KEY='operation-weihnacht-v2';
// Feste Startanordnung (im Bild: oben 3–6–5, unten 2–4–1).
const HEX_START_ORDER=[2,5,4,1,3,0];
const baseState={progress:1,wordGuesses:[],wordWon:false,photoDone:[false,false,false],connSolved:[],connMistakes:4,hexOrder:[...HEX_START_ORDER],hexCompleted:false,hexRevealed:false};
let state={...baseState};
try{const stored=JSON.parse(localStorage.getItem(KEY)||'{}');state={...baseState,...stored};if(!Array.isArray(state.wordGuesses))state.wordGuesses=[];if(!Array.isArray(state.photoDone))state.photoDone=[false,false,false];else state.photoDone=Array.from({length:3},(_,i)=>state.photoDone[i]===true);if(!Array.isArray(state.connSolved))state.connSolved=[];if(!Array.isArray(state.hexOrder)||state.hexOrder.length!==6)state.hexOrder=[...HEX_START_ORDER];else if(!state.hexCompleted&&state.hexOrder.join(',')==='4,2,5,0,3,1')state.hexOrder=[...HEX_START_ORDER]}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
let liveWord='',selectedConn=[],selectedHex=-1,photos=[null,null,null],currentRoute='start',connTip='';
const blankPhotoCheck=()=>({failures:0,systemError:false,busy:false,message:'',kind:'',predictions:[],version:0});
let photoChecks=Array.from({length:3},blankPhotoCheck);
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const allRoutes={start:1,natur:2,wald:3,mosaik:4};
const names=['Das Wort','Drei Spuren','Vier Gruppen','Das Mosaik'];
// Android öffnet lokale Downloads teilweise als content://-Adressen.
// Deren Hash-URLs lassen sich nicht zuverlässig in Chrome kopieren oder öffnen.
// Für lokale Dateien navigieren wir deshalb direkt innerhalb der Seite.
const localMode=!['http:','https:'].includes(location.protocol);
let localRoute='start';
const E=id=>document.getElementById(id);
let toastTimer=null;
function showToast(message){
 const host=E('toast-host');
 if(!host)return;
 clearTimeout(toastTimer);
 host.innerHTML=`<div class="game-toast">${escapeHtml(message)}</div>`;
 toastTimer=setTimeout(()=>{host.replaceChildren();toastTimer=null},1900);
}
function rootUrl(){return location.href.split('#')[0]+'#'}
function routeTo(name){
 if(localMode){localRoute=name;render()}
 else{location.hash=name;if(location.hash==='#'+name)render()}
 window.scrollTo({top:0,behavior:'smooth'});
}
function setProgress(n){state.progress=Math.max(state.progress,n);save()}
function renderProgress(level){E('progress').innerHTML=names.map((n,i)=>`<div class="step ${state.progress>i+1?'done':''} ${level===i+1?'current':''}"><div class="num">${i+1<10?'0':''}${i+1}${state.progress>i+1?' ✓':''}</div><div class="txt">${n}</div></div>`).join('')}
function route(){let key=localMode?localRoute:decodeURIComponent((location.hash||'#start').slice(1)).trim().toLowerCase();return allRoutes[key]?key:'start'}
function render(){
 document.body.classList.remove('christmas-final');

   const tile=TILES[state.hexOrder[pos]];
   const poly=vertices(x,y).map(p=>p.join(',')).join(' ');
   return `<g class='hex-item ${selectedHex===pos?'selected':''}' ${interactive?`data-hex='${pos}' role='button' tabindex='0'`:`role='img'`} aria-label='${tile.name}, Feld ${pos+1}'>
     <image href='${tile.image}' x='${(x-HEX_WIDTH/2).toFixed(2)}' y='${y-R}' width='${HEX_WIDTH.toFixed(2)}' height='${2*R}' preserveAspectRatio='xMidYMid meet' pointer-events='none'/>
     ${interactive?`<polygon class='tile-hit' points='${poly}'/>`:''}
     <polygon class='tile-outline' points='${poly}'/>
   </g>`;
 }).join('')}</svg>`;
}
function renderHex(){
 document.body.classList.toggle('christmas-final',Boolean(state.hexCompleted&&state.hexRevealed));
 if(state.hexCompleted){
   if(!state.hexRevealed){
     E('main').innerHTML=panel(4,'Die Wildnis ist wieder vollständig','Geschafft! Alle sechs Plättchen bilden wieder eine zusammenhängende Landschaft.')+
     `<div class="note">Alle neun Übergänge stimmen. Hier ist deine fertig gelegte Landschaft.</div>${hexSvg(false)}<div class="controls" style="justify-content:center;margin-top:22px"><button class="btn" id="hex-reveal">Geschenk enthüllen</button><button class="btn secondary" id="hex-replay">Mosaik erneut spielen</button></div></section>`;
     E('hex-reveal').onclick=()=>{state.hexRevealed=true;save();renderHex()};
     E('hex-replay').onclick=()=>{state.hexCompleted=false;state.hexRevealed=false;state.hexOrder=[...HEX_START_ORDER];selectedHex=-1;save();renderHex()};
   } else {
     E('main').innerHTML=`<section class="panel finale-panel"><div class="finale"><div class="large-hex">✦</div><h2>${CONFIG.finalTitle}</h2><p class="gift-name" style="font:italic 32px Georgia,serif;margin-top:25px">Cascadia · Im Herzen der Natur</p><div class="controls" style="justify-content:center"><button class="btn secondary" id="revisit">Zurück zur Landschaft</button></div></div></section>`;
     E('revisit').onclick=()=>{state.hexRevealed=false;save();renderHex()};
   }
   return;
 }
 E('main').innerHTML=panel(4,'Das Mosaik der Wildnis','Die Wildnis ist durcheinandergeraten. Tausche die sechs Landschaftsplättchen, bis <strong>Fluss, Wälder, Wiesen und Berge wieder ein zusammenhängendes Bild</strong> ergeben. Die Plättchen behalten ihre Ausrichtung.')+
 `<div class="note">Tippe zuerst ein Plättchen und dann ein zweites an, um ihre Plätze zu tauschen. Alle neun angrenzenden Übergänge müssen zusammenpassen. Es gibt genau eine vollständige Lösung.</div>${hexSvg()}<div class="hex-score" id="hex-score">${matches()} / 9 Landschaftsübergänge stimmen</div><div class="hex-actions"><button class="btn ghost" id="hex-reset">Plättchen zurücksetzen</button><button class="btn secondary" id="hex-hint">Ein Hinweis</button></div><div class="msg" id="hex-msg" style="text-align:center"></div></section>`;
 E('main').querySelectorAll('[data-hex]').forEach(g=>{g.onclick=()=>swapHex(Number(g.dataset.hex));g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();swapHex(Number(g.dataset.hex))}}});
 E('hex-reset').onclick=()=>{state.hexOrder=[...HEX_START_ORDER];state.hexCompleted=false;state.hexRevealed=false;selectedHex=-1;save();renderHex()};E('hex-hint').onclick=()=>{E('hex-msg').textContent='Tipp: Der Lachs gehört nach links oben. Folge danach dem Fluss durch die Landschaft.'}
}
function swapHex(pos){if(selectedHex===-1){selectedHex=pos;renderHex();return}if(selectedHex===pos){selectedHex=-1;renderHex();return}
 [state.hexOrder[selectedHex],state.hexOrder[pos]]=[state.hexOrder[pos],state.hexOrder[selectedHex]];selectedHex=-1;save();if(matches()===ADJ.length){state.hexCompleted=true;save();renderHex()}else renderHex()}
window.addEventListener('hashchange',()=>{selectedConn=[];selectedHex=-1;render();window.scrollTo({top:0})});
render();
loadWordList();
</script>
</body>
